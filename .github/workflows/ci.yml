name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - name: Install Python dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Lint
        run: .venv/bin/ruff check --no-cache backend
      - name: Materialize synthetic receipt images
        env:
          PYTHONPATH: .
        run: .venv/bin/python -m backend.scripts.materialize_evaluation_receipts
      - name: Test
        env:
          PYTHONPATH: .
          RECORD_STORE_PATH: ":memory:"
        run: .venv/bin/python -m pytest backend -q --import-mode=importlib
      - name: Replay frozen evidence
        env:
          PYTHONPATH: .
        run: .venv/bin/python -m backend.evals.final_part_a

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
